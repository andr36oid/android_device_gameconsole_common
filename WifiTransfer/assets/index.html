<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Wi-Fi transfer</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>

<!-- Sign in with the PIN from the console screen -->
<main id="login" class="login" hidden>
  <img src="icon.svg" alt="" class="login-icon">
  <h1>Wi-Fi transfer</h1>
  <p>Enter the PIN shown on the console screen.</p>
  <form id="login-form" autocomplete="off">
    <input id="pin" name="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4"
           autocomplete="one-time-code" aria-label="PIN" placeholder="&#8226;&#8226;&#8226;&#8226;">
    <button type="submit" class="primary">Connect</button>
  </form>
  <p id="login-error" class="error" role="alert"></p>
</main>

<!-- The file browser -->
<div id="app" hidden>
  <header class="bar">
    <div class="bar-title">
      <img src="icon.svg" alt="" class="bar-icon">
      <span>Wi-Fi transfer</span>
    </div>
    <nav id="roots" class="roots" aria-label="Storage"></nav>
  </header>

  <section class="where">
    <nav id="crumbs" class="crumbs" aria-label="Folder"></nav>
    <div id="space" class="space"><div class="space-bar"><div id="space-used"></div></div><span id="space-text"></span></div>
  </section>

  <section class="actions">
    <label class="button primary">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
      Send files
      <input id="pick-files" type="file" multiple hidden>
    </label>
    <label class="button" id="pick-folder-label">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10zM8 13.01l1.41 1.41L11 12.84V17h2v-4.16l1.59 1.59L16 13.01 12.01 9 8 13.01z"/></svg>
      Send a folder
      <input id="pick-folder" type="file" webkitdirectory multiple hidden>
    </label>
    <button id="new-folder" class="button" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-1 8h-3v3h-2v-3h-3v-2h3V9h2v3h3v2z"/></svg>
      New folder
    </button>
  </section>

  <p id="hint" class="hint" hidden></p>

  <main>
    <ul id="list" class="list" aria-live="polite"></ul>
    <p id="empty" class="empty" hidden>This folder is empty. Drop files here or use Send files.</p>
  </main>

  <p class="footer">Files go straight onto the console. Keep this page open until they are all sent.</p>
</div>

<!-- Transfers, slides up from the bottom -->
<aside id="queue" class="queue" hidden aria-live="polite">
  <div class="queue-head">
    <div>
      <div id="queue-title" class="queue-title"></div>
      <div id="queue-sub" class="queue-sub"></div>
    </div>
    <div class="queue-buttons">
      <button id="queue-retry" type="button" class="button small" hidden>Try again</button>
      <button id="queue-cancel" type="button" class="button small">Cancel</button>
      <button id="queue-close" type="button" class="button small" hidden>Close</button>
    </div>
  </div>
  <div class="progress"><div id="queue-bar"></div></div>
  <ul id="queue-list" class="queue-list"></ul>
</aside>

<div id="drop" class="drop" hidden><div>Drop to send to <b id="drop-where"></b></div></div>
<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>

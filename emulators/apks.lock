# Emulator APKs preinstalled on first boot, fetched by scripts/fetch-apks.sh.
#
# The APKs are shipped byte-identical to what F-Droid publishes (sha256 pinned
# below), so the F-Droid signature stays intact and F-Droid can keep updating
# them. F-Droid also publishes the exact source tarball for every build:
#   https://f-droid.org/repo/<package>_<versionCode>_src.tar.gz
#
# name       package              versionCode  versionName  spdx               sha256                                                            license_url
RetroArch    com.retroarch        1597175267   1.22.2       GPL-3.0-only       7120fd7a7f15b7a260366a8122c77070a80bc14bf28d34bc609439b2b52fdb64  https://raw.githubusercontent.com/libretro/RetroArch/v1.22.2/COPYING


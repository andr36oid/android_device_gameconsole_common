; PPSSPP 1.19.3 settings for the R36S (RK3326: 4x Cortex-A35, Mali-G31 GLES 3.2,
; 640x480). Written by gameconsole-emu only when PPSSPP has no ppsspp.ini yet;
; PPSSPP fills in everything not listed here and rewrites the file on exit.
; Why each value: emulators/README.md, "PPSSPP defaults".

[General]
CheckForNewVersion = False
UIScaleFactor = 2
AutoLoadSaveState = 0
StateSlot = 0
EnableStateUndo = False
RewindSnapshotInterval = 0

[CPU]
CPUCore = 1
SeparateSASThread = True
IOTimingMethod = 0
FastMemoryAccess = True
FunctionReplacements = True
CPUSpeed = 0

[Graphics]
GraphicsBackend = 0 (OPENGL)
InternalResolution = 1
AndroidHwScale = 0
SkipBufferEffects = False
FrameSkip = 2
FrameSkipType = 0
AutoFrameSkip = True
HardwareTransform = True
SoftwareSkinning = True
TextureBackoffCache = True
TexScalingLevel = 1
TexScalingType = 0
TexDeposterize = False
TexHardwareScaling = False
TextureShader = Off
SplineBezierQuality = 0
HardwareTessellation = False
AnisotropyLevel = 0
MultiSampleLevel = 0
SkipGPUReadbackMode = 1
TextureFiltering = 1
BufferFiltering = 1
DisplayIntegerScale = False
iShowStatusFlags = 0
ImmersiveMode = True
VSync = True
RenderDuplicateFrames = False

[Sound]
Enable = True
ExtraAudioBuffering = False

[Control]
ShowTouchControls = False
ShowTouchPause = False
HapticFeedback = False
AllowMappingCombos = True

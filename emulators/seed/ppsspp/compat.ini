# GPU readbacks back on for the games that need them. Our ppsspp.ini skips
# readbacks (SkipGPUReadbackMode = 1): on the Mali-G31 each one stalls the
# GPU. PPSSPP marks these games RequireBlockTransfer in its own compat.ini:
# with readbacks skipped they show glitches (black boxes, broken menus or
# shadows) and a 10 second warning at every start. This flag makes PPSSPP
# read back for them only (FramebufferManagerCommon::GetSkipGPUReadbackMode)
# and drops the warning (System.cpp ShowCompatWarnings). The disc IDs and
# comments are PPSSPP 1.19.3's [RequireBlockTransfer] list.
[ForceEnableGPUReadback]
# The Legend of Heroes: Trails in the Sky (menu glitch, ppsspp#8053)
ULUS10540 = true
ULUS10578 = true
ULES01556 = true
ULJM05170 = true
ULJM08033 = true
NPJH50373 = true
NPUH10191 = true
NPUH10197 = true
# Grand Knights History (black boxes on characters, flicker, #2135 #6099)

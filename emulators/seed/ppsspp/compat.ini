# PPSSPP reads this file after its built-in compat.ini, by disc ID, and it
# wins. Seeded by the gameconsole-emu service on a fresh PPSSPP install (see
# game-compat in emulators/README.md). Written for PPSSPP 1.19.3.
#
# God of War at 30 fps. PPSSPP ships this hack but leaves it commented out,
# as "only an option for users with very weak hardware". The game then
# waits for two screen refreshes per frame instead of one, which halves the
# work (PPSSPP forum thread 22159, PR 15640). It needs function replacements,
# which are on. The disc IDs are the ones listed in PPSSPP's own file.
[FramerateHack30]
# God of War: Ghost of Sparta
UCUS98737 = true
UCAS40323 = true
NPHG00092 = true
NPEG00044 = true
NPEG00045 = true
NPJG00120 = true
NPUG80508 = true
UCJS10114 = true
UCES01401 = true
UCES01473 = true
# God of War: Ghost of Sparta demo
NPEG90035 = true
NPUG70125 = true
NPJG90095 = true
# God of War: Chains of Olympus
UCAS40198 = true

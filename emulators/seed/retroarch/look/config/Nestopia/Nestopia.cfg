# NES and Famicom Disk System (Nestopia), see emulators/README.md.
# One frame less input lag: RetroArch keeps a save state of the last frame and,
# only when a button changes, goes back one frame and runs it again with the
# new input (preemptive frames). The NES cores are light enough on the A35 for
# the extra frame. To turn it off for good: Settings, Latency, Run-Ahead
# off, then Quick Menu, Overrides, Save Core Overrides.
preemptive_frames_enable = "true"
run_ahead_enabled = "false"
run_ahead_frames = "1"
notification_show_config_override_load = "false"

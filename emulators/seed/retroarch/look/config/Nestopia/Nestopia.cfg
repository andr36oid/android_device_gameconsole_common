# NES and Famicom Disk System (Nestopia), see emulators/README.md.
# Keep the A35's frame budget for emulation, as in dArkOS. Preemptive frames
# saves a state every frame and replays a frame when input changes, even with
# classic run-ahead off. Leave that latency tradeoff to the user: Settings,
# Latency, Preemptive Frames, then Quick Menu, Overrides, Save Core Overrides
# to keep the choice for this core.
preemptive_frames_enable = "false"
run_ahead_enabled = "false"
run_ahead_frames = "1"
notification_show_config_override_load = "false"

# Game Boy and Game Boy Color (Gambatte), see emulators/README.md.
# Whole-number scaling: 3x on the 640x480 screen (480x432), 4x on 720x720
# (640x576). Smart mode fills the screen instead when a whole number would
# leave more than 12 percent black border.
video_scale_integer = "true"
video_scale_integer_scaling = "2"
notification_show_config_override_load = "false"

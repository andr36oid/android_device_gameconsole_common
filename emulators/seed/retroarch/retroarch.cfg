# RetroArch settings for a fresh install, see emulators/README.md.
# gameconsole-emu writes this file only when RetroArch has no retroarch.cfg yet.
# Everything not listed here keeps RetroArch's own default. RetroArch rewrites the
# file on exit, so these comments do not survive. Keep equals signs and double
# quotes out of the comments: RetroArch's Java side parses such lines as settings.

# Saves and save states next to the game, like ArkOS and dArkOS, so a card
# moves between the systems with its saves. The sort options would add a
# per-core subfolder, so they are off.
savefiles_in_content_dir = "true"
savestates_in_content_dir = "true"
sort_savefiles_enable = "false"
sort_savestates_enable = "false"
sort_savefiles_by_content_enable = "false"
sort_savestates_by_content_enable = "false"

# Write the in-game save to the card every 10 seconds when it changed. FN
# (Home) only pauses RetroArch in the background, and Android may close it
# there without RetroArch writing the save first.
autosave_interval = "10"

# Hotkeys from ArkOS and dArkOS (christianhaitian): hold Select and press
#   Start      quit (press twice)
#   R1 / L1    save / load state
#   Up / Down  previous / next state slot
#   X          menu (L1+R1+Start+Select opens it too)
#   A          pause
#   B          reset
#   Y          screenshot
#   L3         fast forward on/off
# The numbers are Android key codes of the built-in pad.
input_enable_hotkey_btn = "109"
input_exit_emulator_btn = "108"
input_save_state_btn = "103"
input_load_state_btn = "102"
input_state_slot_decrease_btn = "19"
input_state_slot_increase_btn = "20"
input_menu_toggle_btn = "99"
input_menu_toggle_gamepad_combo = "3"
input_pause_toggle_btn = "96"
input_reset_btn = "97"
input_screenshot_btn = "100"
input_toggle_fast_forward_btn = "106"

# RGUI, as on ArkOS: sharp at 640x480, driven by buttons and it needs none of
# the assets RetroArch only unpacks when opened from its own icon. The Android
# default (Material UI) is made for touch screens.
menu_driver = "rgui"

# Not set here: system_directory, where the cores look for BIOS files.
# gameconsole-emu sets it at boot to the bios folder on EASYROMS, like ArkOS,
# because the card's path differs from card to card.

# Video on its own thread, as on ArkOS. Helps the slow Cortex-A35 cores keep
# full speed.
video_threaded = "true"

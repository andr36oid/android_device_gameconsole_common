# RetroArch settings for a fresh install, see emulators/README.md.
# gameconsole-emu writes this file only when RetroArch has no retroarch.cfg yet.
# Everything not listed here keeps RetroArch's own default. RetroArch rewrites the
# file on exit, so these comments do not survive. Keep equals signs and double
# quotes out of the comments: RetroArch's Java side parses such lines as settings.

# Saves and save states next to the game, like ArkOS and dArkOS, so a card
# moves between the systems with its saves. The sort options would add a
# per-core subfolder, so they are off.
savefiles_in_content_dir = "true"
savestates_in_content_dir = "true"
sort_savefiles_enable = "false"
sort_savestates_enable = "false"
sort_savefiles_by_content_enable = "false"
sort_savestates_by_content_enable = "false"

# Write the in-game save to the card every 10 seconds when it changed. FN
# (Home) only pauses RetroArch in the background, and Android may close it
# there without RetroArch writing the save first.
autosave_interval = "10"

# Netplay, two consoles on one Wi-Fi (one console can make a hotspot). The
# host still answers the LAN search, only the internet lobby stays off, so an
# offline console doesn't try to reach lobby.libretro.com. Input latency 1
# frame, and RetroArch may add up to 2 more when the core is too slow to
# replay frames (SNES) or the Wi-Fi is slow. The netplay name is set from the
# device name at boot, see gameconsole-emu.
netplay_public_announce = "false"
netplay_input_latency_frames_min = "1"
netplay_input_latency_frames_range = "2"

# Hotkeys from ArkOS and dArkOS (christianhaitian): hold Select and press
#   Start      quit (press twice)
#   R1 / L1    save / load state
#   Up / Down  previous / next state slot
#   X          menu (L1+R1+Start+Select opens it too)
#   A          pause
#   B          reset
#   Y          screenshot
#   L3         fast forward on/off
# The numbers are Android key codes of the built-in pad.
input_enable_hotkey_btn = "109"
input_exit_emulator_btn = "108"
input_save_state_btn = "103"
input_load_state_btn = "102"
input_state_slot_decrease_btn = "19"
input_state_slot_increase_btn = "20"
input_menu_toggle_btn = "99"
input_menu_toggle_gamepad_combo = "3"
input_pause_toggle_btn = "96"
input_reset_btn = "97"
input_screenshot_btn = "100"
input_toggle_fast_forward_btn = "106"

# No touch buttons over the game. The console has no touch screen, but
# RetroArch turns its on-screen gamepad on for every Android device it does
# not know as a console. After one start from its own icon it would then load
# and draw it over every game (images decoded at each game start, blended
# every frame). Settings, On-Screen Display, On-Screen Overlay turns it back on.
# Left at RetroArch's defaults on purpose, see emulators/README.md: the
# sound resampler, rewind, save state compression, logging, play time and
# history files, menu widgets (cheap here, or cost nothing during play).
input_overlay_enable = "false"

# RGUI, as on ArkOS: sharp at 640x480, driven by buttons and it needs none of
# the assets RetroArch only unpacks when opened from its own icon. The Android
# default (Material UI) is made for touch screens.
menu_driver = "rgui"

# Not set here: who is player 1, and the menu and quit combos for every
# controller. gameconsole-emu sets them at boot and when Settings, Controllers
# changes, see retroarch_players there.

# Not set here: system_directory, where the cores look for BIOS files.
# gameconsole-emu sets it at boot to the bios folder on EASYROMS, like ArkOS,
# because the card's path differs from card to card.

# Sound lag: RetroArch's own sound queue is 64 ms instead of the Android
# default 128. Below it Android keeps at least 190 ms more (AudioTrack, mixer,
# driver). The AudioTrack part (85 ms or more) also covers a slow frame, so
# 64 is still safe.
# ROCKNIX uses 32 on this chip, but without Android's buffers under it.
# Left at RetroArch's defaults on purpose, see emulators/README.md: hard
# GPU sync, frame delay and swapchain images (no effect or a cost on this
# Android GL path), late input polling (already the default).
audio_latency = "64"

# Video on its own thread, as on ArkOS. Helps the slow Cortex-A35 cores keep
# full speed.
video_threaded = "true"

# How games look, see emulators/README.md. The picture fills the screen in
# the game's own shape (aspect ratio core provided, integer scaling off:
# RetroArch's Android defaults). The shader preset config/global.glslp makes
# the pixels look even at uneven scales, config/Gambatte gives the Game Boy
# an exact 3x. gameconsole-emu puts both there, the shader files in shaders.
# The config folder is set here so that RetroArch started from its own icon
# and from Daijishou (which passes no folders) use the same one.
video_shader_enable = "true"
video_shader_dir = "/storage/emulated/0/Android/data/com.retroarch/files/shaders"
rgui_config_directory = "/storage/emulated/0/Android/data/com.retroarch/files/config"

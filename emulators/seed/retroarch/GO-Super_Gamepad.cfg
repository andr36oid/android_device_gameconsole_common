# Built-in pad of the R36S and other RK3326 handhelds (odroidgo3-joypad driver),
# as Android shows it. Button numbers are Android key codes from
# Vendor_484b_Product_1100.kl, axes are AXIS_X/Y (left stick) and AXIS_Z/RZ
# (right stick). The buttons are printed Nintendo style (A right, B bottom), and
# the kernel sends each one's own letter, so every button maps to the RetroPad
# button with the same name and position.
# Seeded by gameconsole-emu, see emulators/README.md.

input_driver = "android"
input_device = "GO-Super Gamepad"
input_device_display_name = "GO-Super Gamepad"

# 0x484b:0x1100
input_vendor_id = "18507"
input_product_id = "4352"

input_b_btn = "97"
input_a_btn = "96"
input_y_btn = "100"
input_x_btn = "99"
input_select_btn = "109"
input_start_btn = "108"
input_l_btn = "102"

# RetroArch profile: Xbox Wireless Controllers over Bluetooth.
# Made for how Android shows these pads on andr36oid: kernel drivers from
# night/usb-peripherals, key layouts from gamepads/keylayout and Android.
# Seeded by gameconsole-emu, see emulators/README.md.
# Button numbers follow retroarch-joypad-autoconfig (MIT, The RetroArch team)
# where they fit this system.
#
# The matches sit in the alternative slots 3 to 9 on purpose. RetroArch adds
# the slot number to a match's score, so these beat the profiles of the same
# pads in RetroArch's own set (slots 0 to 2), which assume other drivers.
#
# The Xbox button opens RetroArch's menu, also on player 2 and up.


# Core option defaults for the R36S (4x Cortex-A35, Mali-G31, 640x480), see
# emulators/README.md. gameconsole-emu puts this file next to retroarch.cfg.
# RetroArch reads it for every core that has no options file of its own yet.
# The first time a core runs, RetroArch copies these values into that core's
# own file (config/<core>/<core>.opt); from then on the user's changes there
# win. Only options that differ from the core's default are listed, plus the
# CPU recompilers, pinned on purpose. Keys and values checked against the core
# sources at the commits in cores.lock. Keep equals signs and double quotes out
# of the comments.

# PlayStation (PCSX ReARMed): recompiler on, no 2x rendering, cheaper sound
# interpolation (dArkOS), skip a frame only when the sound would crackle
pcsx_rearmed_drc = "enabled"
pcsx_rearmed_neon_enhancement_enable = "disabled"
pcsx_rearmed_spu_interpolation = "simple"
pcsx_rearmed_frameskip_type = "auto"

# Nintendo 64 (Mupen64Plus-Next): GLideN64 at 320x240 like ArkOS and ROCKNIX,
# its renderer on a second core, no frame buffer copies to N64 memory (the
# biggest speed cost on a slow CPU; a few effects such as some pause screen
# backgrounds are lost), recompiler and high level RSP
mupen64plus-rdp-plugin = "gliden64"
mupen64plus-43screensize = "320x240"
mupen64plus-ThreadedRenderer = "True"
mupen64plus-EnableCopyColorToRDRAM = "Off"
mupen64plus-EnableCopyDepthToRDRAM = "Off"
mupen64plus-cpucore = "dynamic_recompiler"
mupen64plus-rsp-plugin = "hle"

# SNES (Snes9x 2010): draw on a second core (same picture), skip a frame only
# when the sound would crackle (Super FX games like Star Fox)
snes9x_2010_threaded_ppu = "enabled"
snes9x_2010_frameskip = "auto"

# Arcade (MAME 2003-Plus): no disclaimer and warning screens, 22 kHz sound
# (dArkOS; saves CPU in the heavy drivers)
mame2003-plus_skip_disclaimer = "enabled"
mame2003-plus_skip_warnings = "enabled"
mame2003-plus_sample_rate = "22050"

# Amiga (PUAE 2021): less than cycle exact CPU timing, low resolution output
# when the game allows it (the screen is 640 wide)
puae_cpu_compatibility = "compatible"
puae_video_resolution = "auto-lores"

# Commodore 64 (VICE): no true drive emulation, like dArkOS (much faster
# loading and less CPU; a few copy protected disks need it back on)
vice_drive_true_emulation = "disabled"

# Game Boy Advance (gpSP): recompiler, pinned
gpsp_drc = "enabled"

# Mega Drive / 32X (PicoDrive): recompilers, pinned
picodrive_drc = "enabled"

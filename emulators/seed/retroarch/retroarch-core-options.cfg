# Core option defaults for the R36S (4x Cortex-A35, Mali-G31, 640x480), see
# emulators/README.md. gameconsole-emu puts this file next to retroarch.cfg.
# RetroArch reads it for every core that has no options file of its own yet.
# The first time a core runs, RetroArch copies these values into that core's
# own file (config/<core>/<core>.opt); from then on the user's changes there
# win. Only options that differ from the core's default are listed, plus the
# CPU recompilers and low resource limits, pinned on purpose. Keys and values
# checked against the core
# sources at the commits in cores.lock. Keep equals signs and double quotes out
# of the comments.

# PlayStation (PCSX ReARMed): recompiler on, no 2x rendering, cheaper sound
# interpolation (dArkOS), skip a frame only when the sound would crackle
pcsx_rearmed_drc = "enabled"
pcsx_rearmed_neon_enhancement_enable = "disabled"
pcsx_rearmed_spu_interpolation = "simple"
pcsx_rearmed_frameskip_type = "auto"

# Nintendo 64 (Mupen64Plus-Next): threaded GLideN64, native 1x and HLE.
# Standard bilinear without the extra hybrid scaling filter saves GPU work.
# Keep framebuffer emulation and compatible color/depth copies for game effects.
# Per-game GLideN64 fixes still win; do not select software RDP or LLE RSP.
mupen64plus-rdp-plugin = "gliden64"
mupen64plus-aspect = "4:3"
mupen64plus-43screensize = "320x240"
mupen64plus-EnableNativeResFactor = "1"
mupen64plus-ThreadedRenderer = "True"
mupen64plus-BilinearMode = "standard"
mupen64plus-HybridFilter = "False"
mupen64plus-MultiSampling = "0"
mupen64plus-FXAA = "0"
mupen64plus-EnableFBEmulation = "True"
mupen64plus-EnableCopyColorToRDRAM = "Async"
mupen64plus-EnableCopyDepthToRDRAM = "Software"
mupen64plus-cpucore = "dynamic_recompiler"
mupen64plus-rsp-plugin = "hle"

# SNES (Snes9x 2010): draw on a second core (same picture), skip a frame only
# when the sound would crackle (Super FX games like Star Fox)
snes9x_2010_threaded_ppu = "enabled"
snes9x_2010_frameskip = "auto"

# Arcade (MAME 2003-Plus): no disclaimer and warning screens, 22 kHz sound
# (dArkOS; saves CPU in the heavy drivers)
mame2003-plus_skip_disclaimer = "enabled"
mame2003-plus_skip_warnings = "enabled"
mame2003-plus_sample_rate = "22050"

# Amiga (PUAE 2021): less than cycle exact CPU timing, low resolution output
# when the game allows it (the screen is 640 wide)
puae_cpu_compatibility = "compatible"
puae_video_resolution = "auto-lores"

# Commodore 64 (VICE): no true drive emulation, like dArkOS (much faster
# loading and less CPU; a few copy protected disks need it back on)
vice_drive_true_emulation = "disabled"

# Game Boy Advance (gpSP): recompiler, pinned
gpsp_drc = "enabled"

# Mega Drive / 32X (PicoDrive): recompilers, pinned
picodrive_drc = "enabled"

# Quake: 4 to 3 output at low internal resolution for the software renderer
tyrquake_resolution = "320x240"

# PC-FX is experimental on A35. Stream discs instead of caching an entire CD
# in the roughly one gigabyte of RAM shared with Android
pcfx_cdimagecache = "disabled"

# Wolfenstein 3D uses the original low software-rendering resolution and rate
# rather than spending A35 time on high resolution or uncapped drawing
ecwolf-resolution = "320x200"
ecwolf-fps = "35"

# Atari ST uses the free built-in 192 KB EmuTOS and a lower audio sample rate
# like the reference handheld. Keep the default ST rather than a faster machine
hatarib_tos = "<etos192us>"
hatarib_samplerate = "22050"

# Nintendo DS (melonDS): the ARM recompiler and the threaded software renderer
# are what make DS playable on the A35 (no OpenGL renderer here). Boot games
# straight to the cartridge so no DS firmware file is needed for most of them.
melonds_jit_enable = "enabled"
melonds_threaded_renderer = "enabled"
melonds_boot_directly = "enabled"

# Panasonic 3DO (Opera): run the DSP on its own core and keep native resolution;
# high resolution doubles the pixels the A35 has to draw for no extra detail
opera_dsp_threaded = "enabled"
opera_high_resolution = "disabled"

; Seeded by andr36oid on first start (EasyRPG Player reads [input] in
; Game_Config::LoadFromStream; a button listed here loses all its default
; keys, so the keyboard keys are listed again).
; Select opened "Reset" (straight back to the title screen, unsaved progress
; lost) and R1 toggled an FPS counter. Now Select opens the settings menu like
; Start does (it has "Exit Game", which asks first). Everything else stays
; EasyRPG's default: A confirm, B and X cancel, Y shift, D-pad and left stick
; move.
[input]
SETTINGS_MENU=F1,JOY_START,JOY_BACK
RESET=F12
TOGGLE_FPS=F2

# Syncthing-Fork (Syncthing for Android, by Catfriend1 and researchxxl), the
# arm64-v8a APK from the GitHub release (32 MB; F-Droid only has the 68 MB
# universal APK). Same signer as F-Droid's build (Catfriend1, cert sha256
# d374b8de...), so F-Droid can update it. sha256 from the GitHub release asset
# digest. The Go binary inside (libsyncthingnative.so) is built with
# GOARM64=v8.0; every LSE atomic in it sits behind the runtime HasATOMICS check,
# so it runs on the Cortex-A35 (see reports/overnight2/save-sync.md).
# The Syncthing core it wraps is the "syncthing" git submodule at that tag.

# Seeded by andr36oid on first start. The built-in pad already works with
# ScummVM's own defaults: left stick moves the pointer (R1 slows it down),
# A left click, B right click, X skip line, Y skip (Esc), L1 game menu (F5),
# D-pad arrow keys, Start ScummVM's menu (save, load, quit), Select the
# on-screen keyboard. The touch buttons (menu and keyboard icons) are hidden:
# this console has no touchscreen.
[scummvm]
onscreen_control=false

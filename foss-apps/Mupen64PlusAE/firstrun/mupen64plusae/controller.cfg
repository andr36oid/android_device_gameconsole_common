# Mupen64Plus AE controller profile for the built-in pad of the R36S and other
# RK3326 handhelds ("GO-Super Gamepad"), seeded by andr36oid on first start.
# map = command:input,...  Commands (InputMap.java): 0-3 D-pad R/L/D/U, 4 Start,
# 5 Z, 6 B, 7 A, 8-11 C R/L/D/U, 12 R, 13 L, 16-19 stick R/L/D/U,
# 26 fast forward (hold), 32 in-game menu, 33 screenshot.
# Inputs: Android key codes (96 A right, 97 B bottom, 99 X top, 100 Y left,
# 102/103 L1/R1, 104/105 L2/R2, 106/107 L3/R3, 108 Start, 109 Select,
# 19-22 D-pad) or -(2 * axis + 1) / -(2 * axis + 2) for axis +/- (X 0, Y 1,
# Z 11, RZ 14: right stick).
# N64 A bottom, B left (their places on the N64 pad), C buttons on the right
# stick plus C-left on X and C-down on A (Zelda's item buttons), Z on L2 and
# R2, L/R on L1/R1. Select opens the menu (save/load state, slot, reset, exit):
# this app has no button combos, so Select + button hotkeys can't be done.
[Built-in controls]
comment=R36S built-in pad (andr36oid)
map=0:22,1:21,2:20,3:19,4:108,5:104,5:105,6:100,7:97,8:-23,9:-24,9:99,10:-29,10:96,11:-30,12:103,13:102,16:-1,17:-2,18:-3,19:-4,26:106,32:109,33:107,
deadzone=10
sensitivity_x=100
sensitivity_y=100

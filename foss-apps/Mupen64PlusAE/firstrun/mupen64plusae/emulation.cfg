# Mupen64Plus AE emulation profile for the R36S and other RK3326 handhelds
# (4x Cortex-A35, Mali-G31 GLES 3.2), seeded by andr36oid on first start and
# made the default profile. The same choices as our RetroArch N64 core
# (Mupen64Plus-Next): GLideN64 at the N64's own 320x240, frame buffer
# emulation on but no copies back to N64 memory. Keys are the ones the app
# reads (GamePrefs.java, GLideN64Prefs.java); anything not listed keeps the
# app's default. The app's own profiles stay in the list: pick "Glide64-Fast"
# or "Rice-Fast" in Settings > Emulation profile if a game is too slow.
[Built-in GLideN64]
comment=R36S: GLideN64 at 320x240, fast (andr36oid)
videoPlugin=GLideN64
r4300Emulator=2
rspSetting=rsp-hle
UseNativeResolutionFactor=1
EnableFBEmulation=True
EnableCopyColorToRDRAM=0
EnableCopyDepthToRDRAM=0
EnableN64DepthCompare=False

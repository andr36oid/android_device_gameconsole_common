; Flycast NAOMI/Atomiswave map for the built-in pad of the R36S and other
; RK3326 handhelds ("GO-Super Gamepad"), seeded by andr36oid on first start.
; Buttons 1-4 by position like Flycast's own arcade gamepad layout
; (1 bottom, 2 right, 3 left, 4 top), 5/6 on L2/R2, L1/R1 the analog
; triggers (pedals), Select the coin. Key codes as in dreamcast.cfg.
[emulator]
mapping_name = andr36oid built-in pad (arcade)
dead_zone = 10
saturation = 100
rumble_power = 100
version = 4
triggers =

[digital]
bind0 = 97:btn_a
bind1 = 96:btn_b
bind2 = 100:btn_c
bind3 = 99:btn_x
bind4 = 104:btn_y
bind5 = 105:btn_z
bind6 = 108:btn_start
bind7 = 109:btn_d
bind8 = 19:btn_dpad1_up
bind9 = 20:btn_dpad1_down
bind10 = 21:btn_dpad1_left
bind11 = 22:btn_dpad1_right
bind12 = 102:btn_trigger_left
bind13 = 103:btn_trigger_right

[analog]
; left stick, right stick (AXIS_Z / AXIS_RZ)
bind0 = 0-:axis_left
bind1 = 0+:axis_right
bind2 = 1-:axis_up
bind3 = 1+:axis_down
bind4 = 11-:axis2_left
bind5 = 11+:axis2_right
bind6 = 14-:axis2_up
bind7 = 14+:axis2_down

[combo]
; hold Select (109), then press: sequential, so Select must come first.
; Start quit, R1 save state, L1 load state, Up/Down previous/next slot,
; X menu, A pause, Y screenshot, L3 fast forward on/off
bind0 = 109,108:btn_escape:1
bind1 = 109,103:btn_quick_save:1
bind2 = 109,102:btn_jump_state:1
bind3 = 109,19:btn_prev_slot:1
bind4 = 109,20:btn_next_slot:1
bind5 = 109,99:btn_menu:1
bind6 = 109,96:btn_pause:1
bind7 = 109,100:btn_screenshot:1
bind8 = 109,106:btn_fforward:1

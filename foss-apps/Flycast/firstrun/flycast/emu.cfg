; Flycast 2.7 settings for the R36S and other RK3326 handhelds (4x Cortex-A35,
; Mali-G31 GLES 3.2), seeded by andr36oid before Flycast's first start.
; Only values that differ from Flycast's own defaults (core/cfg/option.cpp).
; Everything else stays at the default, which is already the cheap choice
; here: OpenGL, native 640x480, threaded rendering, dynarec, DSP off,
; texture upscaling off, anisotropic filtering off.
; Flycast rewrites this file with all its settings when you change one.
[config]
; Auto frame skip "Normal": skip a frame only when both the emulated CPU and
; the GPU are behind. Default 0 never skips, so a slow GPU frame slows the
; game and its sound.
pvr.AutoSkipFrame = 1
; Transparent sorting "Per Strip" instead of "Per Triangle": less sorting
; work and fewer draw calls. Settings > Video > Transparent Sorting switches
; it back if a game shows see-through things in the wrong order.
rend.PerStripSorting = yes

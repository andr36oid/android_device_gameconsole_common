# TetrisLite by yet300, built from andr36oid's fork (github.com/andr36oid/TetrisLite,
# branch andr36oid): a start screen that fits our screen, gamepad buttons in the game, a
# focus ring, a full-screen settings page, a game screen for landscape handhelds and the
# andr36oid Коробейники music theme. Not fetched (fetch.sh can't): built with
#   ./gradlew :androidApp:assembleRelease
# (JDK 21, Android SDK 36) and TetrisLite.apk is app/androidApp/build/outputs/apk/
# release/androidApp-release-unsigned.apk. Android.mk signs it with the ROM's key. After
# a new build, update source_url, sha256 and NOTICE.txt's first lines.

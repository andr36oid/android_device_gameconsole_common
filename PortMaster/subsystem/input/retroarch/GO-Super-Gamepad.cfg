input_device = "GO-Super Gamepad"
input_driver = "udev"
input_vendor_id = "6400"
input_product_id = "17"

# RetroArch's udev joypad driver numbers ONLY the real BTN_* buttons on this pad,
# in evdev-code order: BTN_A..BTN_TR2 = 0..7, then BTN_SELECT=8, BTN_START=9. That is
# NOT the order SDL/EmulationStation uses (SDL also counts the pad's keyboard keys as
# buttons and puts start before select), so the native/SDL numbers do not transfer.
# The D-pad is keyboard keys (KEY_UP/DOWN/LEFT/RIGHT), which the udev joypad driver does
# not expose as buttons at all, and the pad has no L3/R3 or guide button -- binding those
# to non-existent indices made RetroArch mishandle input, so they are left unset here.
input_b_btn = "1"
input_a_btn = "0"
input_x_btn = "2"
input_y_btn = "3"
input_l_btn = "4"
input_r_btn = "5"
input_l2_btn = "6"
input_r2_btn = "7"
input_select_btn = "8"
input_start_btn = "9"

input_enable_hotkey_btn = "8"
input_menu_toggle_btn = "nul"

input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_r_x_plus_axis = "+2"
input_r_x_minus_axis = "-2"
input_r_y_plus_axis = "+3"
input_r_y_minus_axis = "-3"
